name: Cypress E2E — Dev

# Auto-triggers after a successful dev deployment.
# Can also be run manually — supply base_url to target a feature branch deployment
# instead of the default dev environment URL, and pick runner=openshift to run
# the suite as an in-cluster Job instead of on the static-IP runner group.
#
# See cypress-e2e-runner.yml for how each runner works and where credentials
# come from.

on:
  workflow_run:
    workflows: ["Dev - Build & Push docker images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override baseUrl (e.g. https://feature-branch.apps.gold.devops.gov.bc.ca/)"
        required: false
        type: string
      runner:
        description: "Where Cypress runs (openshift = in-cluster Job fallback in ce395f-tools)"
        required: false
        type: choice
        options:
          - static-ip
          - openshift
        default: static-ip

permissions:
  contents: read

jobs:
  cypress:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/cypress-e2e-runner.yml
    with:
      env_name: dev
      cypress_config_key: CYPRESS_CONFIG_DEV
      base_url: ${{ inputs.base_url || '' }}
      git_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      runner: ${{ inputs.runner || 'static-ip' }}
    secrets: inherit
