name: Cypress E2E — UAT

# Runs against the UAT environment after a successful main deployment,
# or manually via workflow_dispatch.
#
# Unity has no separate UAT build workflow — UAT deploys off the main build,
# so this triggers off the same workflow_run as prod's build pipeline.
#
# Manual runs can pick runner=openshift to run the suite as an in-cluster Job
# instead of on the static-IP runner group. See cypress-e2e-runner.yml for how
# each runner works and where credentials come from.

on:
  workflow_run:
    workflows: ["Main - Build & Push docker images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where Cypress runs (openshift = in-cluster Job fallback in ce395f-tools)"
        required: false
        type: choice
        options:
          - static-ip
          - openshift
        default: static-ip

permissions:
  contents: read

jobs:
  cypress:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/cypress-e2e-runner.yml
    with:
      env_name: uat
      cypress_config_key: CYPRESS_CONFIG_UAT
      git_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      runner: ${{ inputs.runner || 'static-ip' }}
    secrets: inherit
