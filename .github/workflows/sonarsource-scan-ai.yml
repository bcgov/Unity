name: SonarCloud Analysis - Unity AI

on:
  push:
    branches:
      - dev2
      - dev
      - test
      - main
    paths:
      - 'applications/Unity.AI/**'
      - '.github/workflows/sonarsource-scan-ai.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'applications/Unity.AI/**'
      - '.github/workflows/sonarsource-scan-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  sonarcloud-ai:
    name: SonarCloud Unity AI
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'main' || github.ref_name == 'test' && 'test' || 'dev' }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: applications/Unity.AI/Unity.AI.Reporting.Frontend/package-lock.json

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install Python dependencies
        working-directory: ./applications/Unity.AI/Unity.AI.Reporting.Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install Node.js dependencies
        working-directory: ./applications/Unity.AI/Unity.AI.Reporting.Frontend
        run: npm ci --no-audit --prefer-offline

      - name: Build Angular frontend
        working-directory: ./applications/Unity.AI/Unity.AI.Reporting.Frontend
        run: npm run build

      - name: Set version for SonarCloud
        run: |
          VERSION="${{ vars.UAI_BUILD_VERSION }}"
          echo "Debug: UAI_BUILD_VERSION variable value: '$VERSION'"
          if [ -n "$VERSION" ]; then
            echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
            echo "Using project version: $VERSION"
            # Replace ${BUILD_VERSION} with actual value
            sed -i "s/\${BUILD_VERSION}/$VERSION/g" applications/Unity.AI/sonar-project.properties
          else
            echo "UAI_BUILD_VERSION variable not set - removing sonar.projectVersion property"
            # Remove the projectVersion line entirely if no version is available
            sed -i "/sonar.projectVersion=/d" applications/Unity.AI/sonar-project.properties
          fi

      - name: SonarCloud sonar.projectVersion
        run: |
          echo "BUILD_VERSION environment variable: $BUILD_VERSION"
          echo "Updated sonar-project.properties:"
          cat applications/Unity.AI/sonar-project.properties | grep "sonar.projectVersion" || echo "No projectVersion set"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          projectBaseDir: applications/Unity.AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
