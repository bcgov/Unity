worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 8080;

    # OpenShift Route forwards requests with the "/app" prefix intact (no path
    # stripping), so the app is built with --base-href=/app/ and served to match.
    location /app/ {
      alias /usr/share/nginx/html/app/;
      try_files $uri $uri/ /app/index.html;
    }
  }
}
