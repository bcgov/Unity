# SonarCloud configuration for Unity (Grant Manager + Unity AI Reporting)
sonar.projectKey=bcgov_Unity
sonar.organization=bcgov-sonarcloud
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=Unity
sonar.projectVersion=${BUILD_VERSION}
sonar.projectDescription=Grant management application for the Province of British Columbia

# Source and test code settings. Module test projects are test code too.
sonar.sources=Unity.GrantManager/src,Unity.GrantManager/modules,Unity.AI/Unity.AI.Reporting.Backend/src,Unity.AI/Unity.AI.Reporting.Frontend/src
sonar.tests=Unity.GrantManager/test,Unity.GrantManager/modules,Unity.AI/Unity.AI.Reporting.Backend/test_packages.py
# Test inclusions also exclude these paths from the main source scope.
sonar.test.inclusions=Unity.GrantManager/test/**,Unity.GrantManager/modules/**/test/**,Unity.AI/Unity.AI.Reporting.Backend/test_packages.py

# Quality gate settings
sonar.qualitygate.wait=true

# Language-specific settings (Unity AI Reporting)
sonar.python.version=3.13
sonar.typescript.node=20

# SonarQube Exclusions (generic build artifacts and generated code only)
# Unity AI exclusions are scoped to Unity.AI/** so Grant Manager's scan scope is unchanged.
sonar.exclusions=Unity.GrantManager/src/Unity.GrantManager.EntityFrameworkCore/Migrations/**,Unity.GrantManager/src/Unity.GrantManager.EntityFrameworkCore/Scripts/**,**/bin/**,**/obj/**,**/wwwroot/libs/**,**/*.Designer.cs,**/node_modules/**,Unity.AI/**/dist/**,Unity.AI/**/build/**,Unity.AI/**/coverage/**,Unity.AI/**/__pycache__/**,Unity.AI/**/*.pyc,Unity.AI/**/*.min.js,Unity.AI/**/*.bundle.js,Unity.AI/Unity.AI.Reporting.Frontend/src/environments/**

# Rule exclusion: javascript:S7721 "Functions should be moved to the highest possible scope"
# Disabled project-wide for JS. ABP renders pages by composing many independent widgets,
# and dynamically bundles each widget's scripts together onto whatever page happens to
# host them, at runtime. Widgets have no visibility into what else will be on the same
# page, so the established, intentional pattern across this codebase is to nest each
# widget's helper functions inside its own $(function(){...}) DOM-ready handler, using
# that nesting as the widget's isolation boundary against same-named helpers in other
# widgets (e.g. formatItems, responseCallback, updatePreview are common names reused
# across many widgets). S7721 pushes these helpers up to module/global scope, which
# breaks that isolation and creates real cross-widget name collisions that the rule
# has no way to detect, since it only ever sees one file at a time. This has already
# caused a production bug (two widgets bundled onto the same page silently overwrote
# each other's same-named global function). Keep the nesting.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S7721
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js

# Rule exclusion: Web:MouseEventWithoutKeyboardEquivalentCheck (RSPEC S1082)
# "Mouse events should have corresponding keyboard events"
# Flags <abp-button> tags with an onclick handler for missing onKeyDown/onKeyUp.
# The ABP <abp-button> tag helper always renders a native <button type="button">
# element, which already fires its click handler on Enter/Space via standard
# browser keyboard semantics. No JS keyboard handler is needed or meaningful here;
# the rule can't see past the tag helper to the native button it compiles to.
# Scoped to the specific files with flagged abp-button usages (not rule-wide),
# so unrelated onKeyDown/onKeyUp findings on other tags (e.g. <a>) still surface.
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=**/ScoresheetConfiguration/Index.cshtml
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=**/PaymentApprovals/UpdatePaymentRequestStatus.cshtml
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e4.resourceKey=**/PaymentRequests/CreatePaymentRequests.cshtml
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e5.resourceKey=**/BulkApprovals/ApproveApplicationsModal.cshtml

# Test exclusions
sonar.test.exclusions=**/bin/**,**/obj/**,Unity.AI/**/dist/**,Unity.AI/**/build/**,Unity.AI/**/__pycache__/**

# Coverage analysis explicitly disabled (excludes all files from coverage)
sonar.coverage.exclusions=**/*

# Code duplication exclusions
sonar.cpd.exclusions=**/*.aspx,**/*.aspx.designer.cs,**/*.cshtml,**/*.html,**/*.css,**/*.scss,**/*.js,**/*.spec.ts,**/*

# SCM settings
sonar.scm.provider=git
